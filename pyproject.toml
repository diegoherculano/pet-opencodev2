[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "petwatch"
version = "2.1.0"
description = "Pet de desktop que reage ao estado do opencode"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Diego Herculano" }]
keywords = ["desktop-pet", "opencode", "pyside6", "sse"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications :: Qt",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Utilities",
]
dependencies = ["PySide6>=6.5"]

[project.optional-dependencies]
dev = ["ruff>=0.4"]
# Build do petwatch.exe. Só é usado no Windows: o PyInstaller não faz
# cross-compile, e o executável sai com o bootloader da plataforma que o
# construiu. Ver petwatch.spec.
build = ["pyinstaller>=6.0"]

[project.urls]
Homepage = "https://github.com/diegoherculano/pet-opencodev2"
Repository = "https://github.com/diegoherculano/pet-opencodev2"
Issues = "https://github.com/diegoherculano/pet-opencodev2/issues"
Changelog = "https://github.com/diegoherculano/pet-opencodev2/blob/master/CHANGELOG.md"

[project.scripts]
petwatch = "petwatch.app:main"

[tool.setuptools]
packages = ["petwatch", "petwatch.ui"]

[tool.setuptools.package-data]
petwatch = []

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
