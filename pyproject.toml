[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "petwatch"
version = "2.0.0"
description = "Pet de desktop que reage ao estado do opencode"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Diego Herculano" }]
keywords = ["desktop-pet", "opencode", "pyside6", "sse"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Utilities",
]
dependencies = ["PySide6>=6.5"]

[project.optional-dependencies]
dev = ["ruff>=0.4"]

[project.scripts]
petwatch = "petwatch.app:main"

[tool.setuptools]
packages = ["petwatch", "petwatch.ui"]

[tool.setuptools.package-data]
petwatch = []

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
