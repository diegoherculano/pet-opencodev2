name: Bug report
description: Reporte um comportamento errado do pet
labels: [bug]
body:
  - type: textarea
    id: sintoma
    attributes:
      label: Sintoma
      description: O que o pet fez (ou deixou de fazer)?
      placeholder: O balão ficou em "Thinking" com a pergunta aberta na tela…
    validations:
      required: true
  - type: textarea
    id: reproducao
    attributes:
      label: Como reproduzir
      description: Passos, comandos e contexto (quantas abas, qual projeto)
      placeholder: 1. Abra duas abas do opencode… 2. …
    validations:
      required: true
  - type: input
    id: versao
    attributes:
      label: Versões
      description: Saída de `python --version`, versão do opencode e do SO
      placeholder: Python 3.12, opencode 2.0.22, Ubuntu 24.04 (WSLg)
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Trecho relevante do log
      description: De ~/.local/state/petwatch/pet.log (corte o que for sensível)
      render: text
