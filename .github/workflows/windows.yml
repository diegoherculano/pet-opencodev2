name: Windows

# Build do `petwatch.exe`. O PyInstaller não faz cross-compile: o
# executável precisa ser construído no Windows.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: petwatch.exe
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 pyinstaller

      - name: build
        run: py -3 -m PyInstaller petwatch.spec --noconfirm

      - uses: actions/upload-artifact@v4
        with:
          name: petwatch-windows
          path: dist/petwatch.exe
